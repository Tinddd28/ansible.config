---
# tasks file for 3x-ui

- name: check xui credentials
  ansible.builtin.assert:
    that:
      - xui_username is match('^[A-Za-z0-9._-]*$')
      - xui_password | length == 0 or xui_password | length >= 12
    fail_msg: "XUI_USERNAME с недопустимыми символами или XUI_PASSWORD короче 12 символов"
    quiet: true
  no_log: true

- name: check panel port
  ansible.builtin.assert:
    that:
      - xui_panel_port | string is match('^[0-9]+$')
      - xui_panel_port | int >= 1024
      - xui_panel_port | int <= 65535
      - xui_panel_port | int not in [443, 8443]
    fail_msg: "xui_panel_port={{ xui_panel_port }}: нужен порт 1024-65535, не 443/8443 (заняты xray и caddy)"
    quiet: true

- name: check ssl mode
  ansible.builtin.assert:
    that:
      - xui_ssl_mode in ['none', 'ip']
      - xui_ssl_mode != 'ip' or xui_public_ip is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
    fail_msg: "xui_ssl_mode: none | ip; для ip нужен публичный IPv4 в xui_public_ip (по умолчанию ansible_host)"
    quiet: true

- name: check node settings
  ansible.builtin.assert:
    that:
      - xui_node_token_scope in ['node-sync', 'node-admin']
      - xui_node_token_name is match('^[A-Za-z0-9._-]{1,64}$')
      - xui_node_token_name != 'ansible'
      - xui_web_base_path | length > 0
    fail_msg: >-
      xui_node_token_scope: node-sync | node-admin; xui_node_token_name — до 64 символов
      [A-Za-z0-9._-], не 'ansible' (временный токен роли); для ноды задайте xui_web_base_path
      (главной панели нужен известный путь)
    quiet: true
  when: xui_is_node | bool

- name: check db type
  ansible.builtin.assert:
    that: xui_db_type in ['sqlite', 'postgres']
    fail_msg: "xui_db_type={{ xui_db_type }}: допустимо sqlite или postgres"
    quiet: true

- name: check reality inbound settings
  ansible.builtin.assert:
    that:
      - xui_reality_target | length > 0
      - xui_reality_server_names | select | list | length > 0
      - xui_ssl_mode != 'ip' or xui_reality_target != '127.0.0.1:8443'
      - xui_inbound_port | int != xui_panel_port | int
      - xui_reality_fingerprint in ['chrome', 'firefox', 'safari', 'ios', 'android', 'edge', '360', 'qq', 'random', 'randomized', 'randomizednoalpn']
    fail_msg: >-
      reality-инбаунду нужны target и serverNames (none: из domain_name; ip: задайте
      xui_reality_target / xui_reality_server_names — caddy на 127.0.0.1:8443 нет),
      порт не равен порту панели, fingerprint из списка uTLS
    quiet: true
  when: xui_reality_inbound | bool

- name: check subscription settings
  ansible.builtin.assert:
    that:
      - xui_sub_path is match('^[A-Za-z0-9_-]+$')
      - xui_ssl_mode == 'ip' or (domain_name | default('')) | length > 0
      - xui_sub_port | int != xui_panel_port | int
    fail_msg: >-
      xui_sub_path ({{ xui_sub_path }}) — только буквы, цифры, _ и -, без слешей;
      в режиме none нужен domain_name для хоста; xui_sub_port не должен совпадать с xui_panel_port
    quiet: true
  when: xui_sub_path | length > 0

- name: get installed 3x-ui version
  ansible.builtin.command: "{{ xui_folder }}/x-ui -v"
  register: xui_installed
  changed_when: false
  failed_when: false
  check_mode: false

# ip-режим на уже установленной панели без сертификата: install.sh при повторном
# запуске видит, что сертификата нет, и выпускает его
- name: get panel certificate
  ansible.builtin.command:
    argv: [bash, -c, "{{ xui_cli_wrapped }} setting -getCert=true"]
  register: xui_cert_before
  changed_when: false
  check_mode: false
  when:
    - xui_installed.rc == 0
    - xui_ssl_mode == 'ip'

- name: set 3x-ui install state
  ansible.builtin.set_fact:
    xui_fresh_install: "{{ xui_installed.rc != 0 }}"
    xui_need_install: >-
      {{ xui_installed.rc != 0
         or (xui_installed.stdout | trim) != (xui_version | regex_replace('^v', ''))
         or (xui_ssl_mode == 'ip'
             and not (xui_cert_before.stdout | default('') | regex_search('(?m)^cert:[ ]*[^ \\n]'))) }}

# install.sh останавливает панель и переустанавливает бинарники, настройки и база сохраняются
- name: install 3x-ui
  when:
    - xui_need_install
    - not ansible_check_mode
  block:
    - name: download install.sh
      ansible.builtin.get_url:
        url: "{{ xui_install_script_url }}"
        dest: "{{ xui_install_script }}"
        mode: "0700"
        force: true

    # none: SSL не нужен (панель за caddy / ssh-туннелем), listenIP выставляется ниже;
    # ip: install.sh останавливает панель, acme.sh выпускает сертификат на IP через :80
    - name: run install.sh
      ansible.builtin.command: "bash {{ xui_install_script }} {{ xui_version }}"
      environment: >-
        {{ {
             'XUI_NONINTERACTIVE': '1',
             'XUI_SSL_MODE': xui_ssl_mode,
             'XUI_DB_TYPE': xui_db_type,
             'XUI_PANEL_PORT': xui_panel_port | string,
             'XUI_ENABLE_FAIL2BAN': xui_enable_fail2ban | string | lower,
           }
           | combine({'XUI_USERNAME': xui_username} if xui_username else {})
           | combine({'XUI_PASSWORD': xui_password} if xui_password else {})
           | combine({'XUI_WEB_BASE_PATH': xui_web_base_path} if xui_web_base_path else {})
           | combine({'XUI_DB_DSN': xui_db_dsn} if xui_db_type == 'postgres' and xui_db_dsn else {})
           | combine({'XUI_SERVER_IP': xui_public_ip} if xui_ssl_mode == 'ip' else {})
           | combine({'XUI_ACME_EMAIL': xui_acme_email} if xui_ssl_mode == 'ip' and xui_acme_email else {}) }}
      register: xui_install_out
      failed_when: false
      no_log: true

    # вывод скрыт (в нём пароль), при ошибке показываем только хвост
    - name: check install.sh result
      ansible.builtin.fail:
        msg: "{{ ((xui_install_out.stdout ~ '\n' ~ xui_install_out.stderr) | trim).splitlines()[-25:] }}"
      when: xui_install_out.rc != 0
  always:
    - name: remove install.sh
      ansible.builtin.file:
        path: "{{ xui_install_script }}"
        state: absent

# в check mode при первой установке панели ещё нет — настраивать нечего
- name: configure 3x-ui panel
  when: not (ansible_check_mode and xui_need_install)
  block:
    # для postgres без этих переменных CLI работал бы с пустой sqlite
    - name: read panel db env
      ansible.builtin.slurp:
        src: "{{ xui_env_file }}"
      register: xui_env_raw
      failed_when: false
      no_log: true

    - name: set panel cli env
      ansible.builtin.set_fact:
        xui_cli_env: >-
          {{ dict(((xui_env_raw.content | default('')) | b64decode).splitlines()
                  | select('match', '^XUI_DB_[A-Z_]+=')
                  | map('regex_findall', '^([^=]+)=(.*)$')
                  | map('first')) }}
      no_log: true

    - name: check panel db type
      ansible.builtin.assert:
        that: (xui_cli_env.XUI_DB_TYPE | default('sqlite')) == xui_db_type
        fail_msg: >-
          панель установлена с базой {{ xui_cli_env.XUI_DB_TYPE | default('sqlite') }},
          а xui_db_type={{ xui_db_type }}; смена базы ролью не поддерживается (нужна миграция данных)
        quiet: true

    - name: read panel settings
      ansible.builtin.command: "{{ xui_folder }}/x-ui setting -show=true"
      environment: "{{ xui_cli_env }}"
      register: xui_settings
      changed_when: false
      check_mode: false

    - name: read panel listen IP
      ansible.builtin.command: "{{ xui_folder }}/x-ui setting -getListen=true"
      environment: "{{ xui_cli_env }}"
      register: xui_listen
      changed_when: false
      check_mode: false

    - name: read panel certificate
      ansible.builtin.command: "{{ xui_folder }}/x-ui setting -getCert=true"
      environment: "{{ xui_cli_env }}"
      register: xui_cert
      changed_when: false
      check_mode: false

    - name: parse panel settings
      ansible.builtin.set_fact:
        xui_current_cert: "{{ xui_cert.stdout | regex_search('(?m)^cert: *(\\S*)', '\\1') | first | default('') }}"
        xui_current_key: "{{ xui_cert.stdout | regex_search('(?m)^key: *(\\S*)', '\\1') | first | default('') }}"
        xui_current_port: "{{ xui_settings.stdout | regex_search('(?m)^port: *(\\S*)', '\\1') | first | default('') }}"
        xui_current_path: "{{ xui_settings.stdout | regex_search('(?m)^webBasePath: *(\\S*)', '\\1') | first | default('') | trim('/') }}"
        # пустой listenIP и 0.0.0.0 — одно и то же (пустое значение CLI выставить не умеет)
        xui_current_listen: "{{ xui_listen.stdout | regex_search('(?m)^listenIP: *(\\S*)', '\\1') | first | default('', true) or '0.0.0.0' }}"

    # install.sh не прерывается, если сертификат не выпустился — проверяем сами
    - name: check panel certificate
      ansible.builtin.assert:
        that: xui_current_cert | length > 0 and xui_current_key | length > 0
        fail_msg: >-
          сертификат Let's Encrypt на {{ xui_public_ip }} не выпущен: порт 80 должен быть
          свободен (без caddy) и открыт снаружи; лог — /root/.acme.sh/acme.sh.log
        quiet: true
      when: xui_ssl_mode == 'ip'

    # уже развёрнутая панель с собственным сертификатом отдаёт только https —
    # caddy (reverse_proxy по http) и API-вызовы роли сломались бы; ничего не меняем
    - name: check panel has no own certificate
      ansible.builtin.assert:
        that: xui_current_cert | length == 0
        fail_msg: >-
          у панели настроен сертификат ({{ xui_current_cert }}), а xui_ssl_mode=none (панель за caddy,
          http на 127.0.0.1): уберите сертификат в панели (Settings -> Panel -> сертификат/ключ) или
          задайте хосту xui_ssl_mode: ip
        quiet: true
      when: xui_ssl_mode == 'none'

    # install.sh в неинтерактивном режиме слушает 0.0.0.0 — в режиме none переводим на localhost
    - name: apply panel settings
      ansible.builtin.command:
        argv: >-
          {{ [xui_folder ~ '/x-ui', 'setting']
             + (['-listenIP', xui_listen_ip] if xui_current_listen != xui_listen_ip else [])
             + (['-port', xui_panel_port | string] if xui_current_port != xui_panel_port | string else [])
             + (['-webBasePath', xui_web_base_path] if xui_web_base_path and xui_current_path != xui_web_base_path else []) }}
      environment: "{{ xui_cli_env }}"
      when: >-
        xui_current_listen != xui_listen_ip
        or xui_current_port != xui_panel_port | string
        or (xui_web_base_path and xui_current_path != xui_web_base_path)
      notify: restart x-ui

    - name: ensure x-ui is running
      ansible.builtin.service:
        name: x-ui
        state: started
        enabled: true

# всё, чего нет в CLI (подписка, инбаунд), настраивается через API панели
# под временным токеном, который в конце отзывается
- name: configure panel via api
  when:
    - xui_sub_path | length > 0 or xui_reality_inbound | bool or xui_is_node | bool
    - not ansible_check_mode
  block:
    # перезапуск после смены порта/пути панели должен пройти до обращения к API
    - name: apply pending panel restart
      ansible.builtin.meta: flush_handlers

    # токен с именем ansible ротируется при каждом вызове, старый перестаёт работать
    - name: issue panel api token
      ansible.builtin.command:
        argv:
          - "{{ xui_folder }}/x-ui"
          - setting
          # булевы флаги Go только через "=": "-getApiToken true" обрывает разбор,
          # и -tokenName/-tokenScope молча игнорируются (токен становится cli-fallback/admin)
          - -getApiToken=true
          - -tokenName
          - ansible
          - -tokenScope
          - admin
      environment: "{{ xui_cli_env }}"
      register: xui_token_out
      changed_when: false
      no_log: true

    - name: set panel api access
      ansible.builtin.set_fact:
        xui_api_token: "{{ xui_token_out.stdout | regex_search('(?m)^apiToken: *(\\S+)', '\\1') | first | default('') }}"
        # в ip-режиме панель отдаёт только https с сертификатом на внешний IP
        xui_api_root: >-
          {{ 'https' if xui_ssl_mode == 'ip' else 'http' }}://127.0.0.1:{{ xui_panel_port }}/{{ (xui_web_base_path or xui_current_path) ~ '/' if (xui_web_base_path or xui_current_path) else '' }}panel/api
        xui_sub_wanted: "{{ xui_sub_base | combine({'subTitle': xui_name} if xui_name else {}) }}"
      vars:
        xui_sub_base:
          subEnable: true
          subListen: "{{ xui_sub_listen }}"
          subPort: "{{ xui_sub_port | int }}"
          subPath: "/{{ xui_sub_path }}/"
          subDomain: ""
          subURI: "{{ xui_sub_uri | trim }}"
          # ip-режим: сервер подписки отдаёт https тем же сертификатом, что и панель
          subCertFile: "{{ xui_current_cert if xui_ssl_mode == 'ip' else '' }}"
          subKeyFile: "{{ xui_current_key if xui_ssl_mode == 'ip' else '' }}"
      no_log: true

    - name: check panel api token
      ansible.builtin.assert:
        that: xui_api_token | length > 0
        fail_msg: "не удалось выпустить API-токен панели (x-ui setting -getApiToken)"
        quiet: true

    # панель могла только что перезапуститься — ждём, пока поднимется
    # (настройки читаются в любом случае: заодно это проверка, что API доступен)
    - name: read panel settings via api
      ansible.builtin.uri:
        url: "{{ xui_api_root }}/setting/all"
        method: POST
        headers:
          Authorization: "Bearer {{ xui_api_token }}"
        return_content: true
        validate_certs: "{{ xui_ssl_mode != 'ip' }}"
      register: xui_all
      until: xui_all.status == 200
      retries: 10
      delay: 3
      no_log: true

    - name: check panel settings response
      ansible.builtin.assert:
        that: xui_all.json.success | default(false)
        fail_msg: "API панели: {{ xui_all.json.msg | default(xui_all.status) }}"
        quiet: true

    # настройки подписки в CLI нет: читаем все настройки, подставляем свои поля и записываем
    # целиком (замаскированные секреты панель при записи сохраняет)
    - name: update subscription settings via api
      ansible.builtin.uri:
        url: "{{ xui_api_root }}/setting/update"
        method: POST
        headers:
          Authorization: "Bearer {{ xui_api_token }}"
        body_format: json
        body: "{{ xui_all.json.obj | combine(xui_sub_wanted) }}"
        return_content: true
        validate_certs: "{{ xui_ssl_mode != 'ip' }}"
      register: xui_update
      changed_when: true
      failed_when: false
      when:
        - xui_sub_path | length > 0
        - xui_all.json.obj | combine(xui_sub_wanted) != xui_all.json.obj
      notify: restart x-ui
      no_log: true

    - name: check subscription update
      ansible.builtin.assert:
        that: xui_update.json.success | default(false)
        fail_msg: "API панели: {{ xui_update.json.msg | default(xui_update.status | default('?')) }}"
        quiet: true
      when: xui_update is changed

    - name: create reality inbound
      ansible.builtin.include_tasks: inbound.yml
      when: xui_reality_inbound | bool

    - name: issue node token
      ansible.builtin.include_tasks: node.yml
      when: xui_is_node | bool
  # токен нужен только на время настройки — отзываем его в любом случае
  always:
    - name: list panel api tokens
      ansible.builtin.uri:
        url: "{{ xui_api_root }}/setting/apiTokens"
        method: GET
        headers:
          Authorization: "Bearer {{ xui_api_token }}"
        return_content: true
        validate_certs: "{{ xui_ssl_mode != 'ip' }}"
      register: xui_tokens
      failed_when: false
      no_log: true
      when: xui_api_token | default('') | length > 0

    - name: revoke panel api token
      ansible.builtin.uri:
        url: "{{ xui_api_root }}/setting/apiTokens/delete/{{ item.id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ xui_api_token }}"
        body_format: json
        body:
          expectedScope: admin
        return_content: true
        validate_certs: "{{ xui_ssl_mode != 'ip' }}"
      loop: "{{ (xui_tokens.json.obj | default([])) | selectattr('name', 'eq', 'ansible') | list }}"
      loop_control:
        label: "{{ item.name }} (id {{ item.id }})"
      register: xui_revoke
      changed_when: true
      failed_when: false
      no_log: true
      when: xui_tokens.json is defined

    # не роняем плейбук: при следующем запуске токен всё равно перевыпустится и будет отозван
    - name: warn if api token was not revoked
      ansible.builtin.debug:
        msg: >-
          API-токен "ansible" не отозван — удалите его в панели (Settings -> API Tokens)
          или он будет отозван при следующем запуске роли
      when: >-
        xui_api_token | default('') | length > 0
        and (xui_tokens.json.success | default(false) is false
             or (xui_revoke.results | default([]) | length == 0)
             or (xui_revoke.results | rejectattr('json.success', 'defined') | list | length > 0)
             or (xui_revoke.results | selectattr('json.success', 'defined') | rejectattr('json.success') | list | length > 0))

# учётные данные показываем только после первой установки
- name: show panel access
  when:
    - xui_fresh_install
    - not ansible_check_mode
  block:
    - name: read install result
      ansible.builtin.slurp:
        src: "{{ xui_install_result }}"
      register: xui_result_raw

    - name: show panel access
      vars:
        xui_result: >-
          {{ dict((xui_result_raw.content | b64decode).splitlines()
                  | select('match', '^XUI_[A-Z_]+=')
                  | map('regex_findall', '^([^=]+)=(.*)$')
                  | map('first')) }}
      ansible.builtin.debug:
        msg:
          - >-
            {{ ('https://' ~ xui_public_ip ~ ':' ~ xui_panel_port ~ '/' ~ xui_current_path ~ '/')
               if xui_ssl_mode == 'ip' else
               ('ssh -N -L ' ~ xui_panel_port ~ ':127.0.0.1:' ~ xui_panel_port ~ ' -p ' ~ (ansible_port | default(22))
                ~ ' tunnel@' ~ (ansible_host | default(inventory_hostname))
                ~ '  ->  http://127.0.0.1:' ~ xui_panel_port ~ '/' ~ xui_current_path ~ '/') }}
          - "username: {{ xui_result.XUI_USERNAME | default('?') }}"
          - "password: {{ xui_result.XUI_PASSWORD | default('?') }}"
          - "db: {{ xui_result.XUI_DB_TYPE | default(xui_db_type) }}"
          - "сохранено на сервере в {{ xui_install_result }}"
