---
# defaults file for firewall

# ufw: входящие закрыты, кроме перечисленного; исходящие открыты
# порт ssh — тот, по которому подключается ansible (ansible_port в hosts.yml)
firewall_ssh_port: "{{ ansible_port | default(22) }}"

firewall_allow:
  - { port: "{{ firewall_ssh_port }}", proto: tcp }
  - { port: 80, proto: tcp }    # caddy: редирект на https, ACME HTTP-01
  - { port: 443, proto: tcp }   # xray (REALITY) -> caddy

# дополнительные правила для хоста (hosts.yml), например:
# firewall_allow_extra:
#   - { port: 8443, proto: tcp }
firewall_allow_extra: []

# 3x-ui в ip-режиме (без caddy): панель и подписка открыты наружу на своих портах
firewall_allow_xui: >-
  {{ ([{'port': xui_panel_port | default(2053), 'proto': 'tcp'}]
      + ([{'port': xui_sub_port | default(2096), 'proto': 'tcp'}] if (xui_sub_path | default('')) else []))
     if (xui_ssl_mode | default('none')) == 'ip' else [] }}
