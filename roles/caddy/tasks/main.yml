---
# tasks file for caddy

# в ip-режиме 3x-ui acme.sh выпускает и продлевает сертификат на :80 — caddy там мешает
- name: check 3x-ui mode
  ansible.builtin.assert:
    that: (xui_ssl_mode | default('none')) != 'ip'
    fail_msg: "у хоста xui_ssl_mode=ip (3x-ui без caddy): caddy с ним несовместим, оба используют порт 80"
    quiet: true

- name: check caddy vars
  ansible.builtin.assert:
    that:
      - domain_name | length > 0
    fail_msg: "не задан domain_name для {{ inventory_hostname }} (hosts.yml)"
    quiet: true

- name: check panel settings
  ansible.builtin.assert:
    that:
      - caddy_panel_path is match('^[A-Za-z0-9_-]+$')
      - caddy_panel_port | string is match('^[0-9]+$')
      - caddy_panel_port | int != caddy_port | int
    fail_msg: "xui_web_base_path ({{ caddy_panel_path }}) — только буквы, цифры, _ и -, без слешей; xui_panel_port не должен совпадать с caddy_port"
    quiet: true
  when: caddy_panel_enabled | bool

- name: check subscription settings
  ansible.builtin.assert:
    that:
      - caddy_sub_path is match('^[A-Za-z0-9_-]+$')
      - caddy_sub_path != caddy_panel_path
      - caddy_sub_port | int not in [caddy_port | int, caddy_panel_port | int]
    fail_msg: "xui_sub_path ({{ caddy_sub_path }}) — только буквы, цифры, _ и -, не равен пути панели; xui_sub_port не равен порту caddy/панели"
    quiet: true
  when: caddy_sub_path | length > 0

- name: check naive users
  ansible.builtin.assert:
    that:
      - caddy_naive_users | length > 0
      - caddy_naive_users | rejectattr('name', 'match', '^[A-Za-z0-9._-]+$') | list | length == 0
      - caddy_naive_users | rejectattr('password', 'match', '^[A-Za-z0-9._~-]{12,}$') | list | length == 0
    fail_msg: >-
      caddy_naive_users пуст (NAIVE_USER / NAIVE_PASSWORD), в имени недопустимые символы
      или password короче 12 символов / со спецсимволами (openssl rand -hex 16)
    quiet: true
  when: caddy_naive_enabled

- name: create tunnel user
  when: caddy_tunnel_user | length > 0
  block:
    - name: create tunnel group
      ansible.builtin.group:
        name: "{{ caddy_tunnel_group }}"
        state: present

    - name: read root authorized_keys
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: caddy_root_keys

    # password '*' — входа по паролю нет, но аккаунт не залочен (иначе sshd может отклонить ключ)
    - name: create tunnel user
      ansible.builtin.include_role:
        name: users
      vars:
        users_list:
          - name: "{{ caddy_tunnel_user }}"
            group: "{{ caddy_tunnel_group }}"
            shell: /usr/sbin/nologin
            password: "*"
            ssh_keys: >-
              {{ (caddy_root_keys.content | b64decode).splitlines()
                 | map('trim') | reject('match', '^(#|$)') | list }}

# образ собирается заранее (make caddy),
# здесь только проверка актуальности и загрузка на сервер
- name: deliver caddy image
  ansible.builtin.include_tasks: image.yml

- name: create caddy directories
  ansible.builtin.file:
    path: "{{ caddy_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - conf
    - site
    - data
    - config
  register: caddy_dir_result

- name: deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/conf/Caddyfile"
    mode: "0600"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --adapter caddyfile --config /tmp/Caddyfile
  no_log: true
  notify: reload caddy

# у каждого хоста свой сайт: files/<inventory_hostname>/ (index.html и любые ресурсы) —
# общего сайта нет намеренно: одинаковые страницы на разных серверах легко связать
- name: check host site
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ inventory_hostname }}/index.html"
  register: caddy_host_site
  delegate_to: localhost
  become: false

- name: require host site
  ansible.builtin.assert:
    that: caddy_host_site.stat.exists
    fail_msg: "нет roles/caddy/files/{{ inventory_hostname }}/index.html — у каждого хоста должен быть свой сайт"
    quiet: true

- name: deploy site
  ansible.builtin.copy:
    src: "{{ inventory_hostname }}/"
    dest: "{{ caddy_dir }}/site/"
    mode: "0644"
    directory_mode: "0755"

- name: deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_dir }}/docker-compose.yml"
    mode: "0644"

# образ уже загружен выше, compose пересоздаст контейнер, если он обновился
- name: start caddy
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
    pull: never
  when: not (ansible_check_mode and caddy_dir_result is changed)
