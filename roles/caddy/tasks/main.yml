---
# tasks file for caddy

- name: check caddy vars
  ansible.builtin.assert:
    that:
      - domain_name | length > 0
    fail_msg: "не задан domain_name для {{ inventory_hostname }} (hosts.yml)"
    quiet: true

- name: check naive users
  ansible.builtin.assert:
    that:
      - caddy_naive_users | length > 0
      - caddy_naive_users | rejectattr('name', 'match', '^[A-Za-z0-9._-]+$') | list | length == 0
      - caddy_naive_users | rejectattr('password', 'match', '^[A-Za-z0-9._~-]{12,}$') | list | length == 0
    fail_msg: >-
      caddy_naive_users пуст (NAIVE_USER / NAIVE_PASSWORD), в имени недопустимые символы
      или password короче 12 символов / со спецсимволами (openssl rand -hex 16)
    quiet: true
  when: caddy_naive_enabled

- name: create tunnel user
  when: caddy_tunnel_user | length > 0
  block:
    - name: create tunnel group
      ansible.builtin.group:
        name: "{{ caddy_tunnel_group }}"
        state: present

    - name: read root authorized_keys
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: caddy_root_keys

    # password '*' — входа по паролю нет, но аккаунт не залочен (иначе sshd может отклонить ключ)
    - name: create tunnel user
      ansible.builtin.include_role:
        name: users
      vars:
        users_list:
          - name: "{{ caddy_tunnel_user }}"
            group: "{{ caddy_tunnel_group }}"
            shell: /usr/sbin/nologin
            password: "*"
            ssh_keys: >-
              {{ (caddy_root_keys.content | b64decode).splitlines()
                 | map('trim') | reject('match', '^(#|$)') | list }}

# образ собирается заранее (make caddy),
# здесь только проверка актуальности и загрузка на сервер
- name: deliver caddy image
  ansible.builtin.include_tasks: image.yml

- name: create caddy directories
  ansible.builtin.file:
    path: "{{ caddy_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - conf
    - site
    - data
    - config
  register: caddy_dir_result

- name: deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/conf/Caddyfile"
    mode: "0600"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --adapter caddyfile --config /tmp/Caddyfile
  no_log: true
  notify: reload caddy

- name: deploy site
  ansible.builtin.copy:
    src: index.html
    dest: "{{ caddy_dir }}/site/index.html"
    mode: "0644"

- name: deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_dir }}/docker-compose.yml"
    mode: "0644"

# образ уже загружен выше, compose пересоздаст контейнер, если он обновился
- name: start caddy
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
    pull: never
  when: not (ansible_check_mode and caddy_dir_result is changed)
